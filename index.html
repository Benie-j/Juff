{id:'m11',y:2023,q:"Un dictionnaire affiché 24 000 F coûte 18 000 F à l’achat. Pourcentage de remise :",o:["75 %","25 %","30 %"],a:1,e:"Remise 6 000 F ; {6 000|24 000} × 100 = 25 %."},
{id:'m12',y:2023,q:"Décomposition de 1575 en facteurs premiers :",o:["−9 × 5² × 7","3² × 5 × 7","3² × 5² × 7"],a:2,e:"1575 = 5 × 315 = 5 × 5 × 63 = 5² × 3² × 7."},
{id:'m13',y:2023,q:"{3|1 − √3} = …",o:["{3 − √3|−2}","{−3 − 3√3|2}","{3√3 − 3|2}"],a:1,e:"Multiplie par le conjugué 1 + √3 : {3(1 + √3)|1 − 3} = {3 + 3√3|−2} = {−3 − 3√3|2}."},

{id:'m15',y:2024,q:"Si −2 < x < −1 et 2 < y < 4, alors…",o:["−6 < x − y < −3","−5 < x − y < −3","−5 < x − y < −4"],a:0,e:"−4 < −y < −2. On ajoute −2 < x < −1 : −6 < x − y < −3."},
{id:'m16',y:2024,q:"Volume d’une pyramide de base carrée de côté 4 et de hauteur 6 :",o:["24","32","36"],a:1,e:"{1|3} × 16 × 6 = 32."},

{id:'m18',y:2024,q:"f est affine avec f(2) = 5 et f(−1) = 2. Alors f(x) =",o:["2x + 5","5x − 3","x + 3"],a:2,e:"a = {5 − 2|2 + 1} = 1 ; 2 = −1 + b donc b = 3."},
{id:'m19',y:2024,q:"B est le milieu de [AC]. Quelle égalité est vraie ?",o:["BA⃗ = {1|2}AC⃗","AB⃗ = −CB⃗","CA⃗ = 2BC⃗"],a:1,e:"AB⃗ = BC⃗ = −CB⃗. Attention : le corrigé scanné donne a), mais BA⃗ = −{1|2}AC⃗, donc a) est fausse."},
{id:'m22',y:2025,q:"Forme factorisée de (2x − 1)² − 9 :",o:["4(x + 2)(x − 1)","4(x − 2)(x − 1)","4(x − 2)(x + 1)"],a:2,e:"a² − b² = (a − b)(a + b) : (2x − 4)(2x + 2) = 4(x − 2)(x + 1)."},
{id:'m23',y:2025,q:"Médiane de la série 2 ; 13 ; 3 ; 11 ; 5 ; 19 :",o:["8","5","11"],a:0,e:"Rangée : 2, 3, 5, 11, 13, 19. N = 6 : {5 + 11|2} = 8."},
{id:'m24',y:2025,q:"Milieu de [AB] avec A({1|2} ; {3|2}) et B({3|2} ; {9|2}) :",o:["(1 ; 2)","(1 ; 3)","(2 ; {5|2})"],a:1,e:"x : {1|2} + {3|2} = 2, puis 2 ÷ 2 = 1. y : {3|2} + {9|2} = 6, puis 6 ÷ 2 = 3."},

{id:'m26',y:2026,q:"Solutions du système 2x − 5y = 16 et 3x + y = 7 :",o:["(−3 ; 2)","(3 ; −2)","(−3 ; −2)","(3 ; 2)"],a:1,e:"y = 7 − 3x ; 2x − 35 + 15x = 16 ; 17x = 51 ; x = 3 ; y = −2."},

Q.push(
{id:'f1',y:'IPNETP 2021',s:'f',q:"Quelle phrase est correctement orthographiée ?",o:["Quelque soient ses volontés, je les accepterai.","Quelles que soit ses volontés, je les accepterai.","Quelles que soient ses volontés, je les accepterai.","Quelques soient ses volontés, je les accepterai."],a:2,e:"« Quelle que » s’écrit en deux mots et s’accorde avec le sujet : volontés est au pluriel, donc « Quelles que soient »."},
{id:'f2',y:'IPNETP 2021',s:'f',q:"Ils se donnent les moyens « de leur grande ambition ». Le pronom qui remplace le groupe souligné est :",o:["Ils s’en donnent les moyens.","Ils se donnent les moyens de cela.","Ils se les donnent.","Ils s’y donnent les moyens."],a:0,e:"Le pronom « en » remplace un complément introduit par « de »."},
{id:'f3',y:'IPNETP 2021',s:'f',q:"Lequel de ces mots en -al ne fait pas son pluriel en -aux ?",o:["cheval","vassal","festival","mal"],a:2,e:"Des festivals. Cheval, vassal et mal font chevaux, vassaux, maux."},
{id:'f4',y:'IPNETP 2021',s:'f',q:"Futur simple de « boire » à la 2ᵉ personne du singulier :",o:["Tu buvras","Tu boiras","Tu buveras","Tu boireras"],a:1,e:"Boire : je boirai, tu boiras. (Sur le scan, l’option b a une apostrophe en trop.)"},
{id:'f5',y:'IPNETP 2021',s:'f',q:"Le synonyme de « flegme » est :",o:["Calme","Enthousiasme","Faiblesse","Excitation"],a:0,e:"Le flegme est un calme que rien ne trouble."},
{id:'f6',y:'IPNETP 2021',s:'f',q:"Le verbe « rire » à l’imparfait de l’indicatif :",o:["vous rirez","vous riez","vous riiez","vous ririez"],a:2,e:"Imparfait : nous riions, vous riiez. « Vous riez » est le présent, « vous ririez » le conditionnel."},
{id:'f7',y:'IPNETP 2021',s:'f',q:"Accorde le participe passé : Les différentes délégations qui se sont … n’ont guère fait mieux.",o:["succédées","succédé","succédés","succéder"],a:1,e:"« Se succéder » : « se » est complément indirect (succéder à), donc le participe reste invariable."},
{id:'f8',y:'IPNETP 2021',s:'f',q:"Pluriel correct de « chef-d’œuvre » :",o:["chef-d’œuvres","chefs-d’œuvre","chef-d’œuvre","chefs-d’œuvres"],a:1,e:"Des chefs-d’œuvre : « chef » prend le s, « œuvre » reste au singulier."},
{id:'f9',y:'IPNETP 2021',s:'f',q:"Dans le plan dialectique d’une dissertation, la synthèse…",o:["reprend de façon appuyée la thèse,","fait le résumé de la thèse et de l’antithèse,","dépasse les deux thèses et développe le sujet dans une autre perspective,","reprend de façon appuyée l’antithèse."],a:2,e:"La synthèse dépasse l’opposition entre la thèse et l’antithèse."},
{id:'f10',y:'IPNETP 2021',s:'f',q:"L’adverbe dérivé de « puissant » est :",o:["puissamment","puissament","guissement","Puissament"],a:0,e:"Les adjectifs en -ant donnent des adverbes en -amment : puissant, puissamment."},
{id:'f11',y:'IPNETP 2021',s:'f',q:"Elles se sont …",o:["Parlées","Parlé","Parlés","Parlée"],a:1,e:"« Se parler » : « se » est complément indirect (parler à), donc le participe reste invariable."},
{id:'f12',y:'IPNETP 2021',s:'f',q:"Les étudiants … à notre amical seront reçus par le directeur.",o:["adhérants","adhérant","adhérents","adhérants"],a:2,e:"« Adhérent » (adjectif ou nom) prend -ent et s’accorde : adhérents. « Adhérant » est le participe présent, invariable. (Les options a et d sont identiques sur le scan.)"},
{id:'f13',y:'IPNETP 2021',s:'f',q:"Moi, je ne sors que le lundi. Phrase de même sens :",o:["Je sors seulement le lundi.","Je sors aussi le lundi.","Je sors généralement le lundi.","Je sors peut-être le lundi."],a:0,e:"« Ne … que » exprime la restriction : seulement."},
{id:'f14',y:'IPNETP 2021',s:'f',q:"Quelle proposition est correcte ?",o:["Il envoiera","Il enverra","Il envéra","Il envoyera"],a:1,e:"Envoyer fait « j’enverrai » au futur."},
{id:'f15',y:'IPNETP 2021',s:'f',q:"Quel nombre est mal écrit ?",o:["Huit cent millions","Six mille un","Huit cent vingt","Quatre-vingts"],a:0,e:"« Cent » prend un s quand il est multiplié et suivi d’un nom : huit cents millions. Dans « huit cent vingt », il est suivi d’un nombre : pas de s."},
{id:'f16',y:'IPNETP 2021',s:'f',q:"J’aimerais avoir … de temps pour finir mon livre.",o:["D’avantages","Avantages","D’avantage","Davantage"],a:3,e:"« Davantage » (adverbe, un seul mot) : davantage de temps."},
{id:'f17',y:'IPNETP 2021',s:'f',q:"Les frères consanguins sont issus :",o:["De la même mère et non du même père","Du même père et non de la même mère","De pères cousins","De père frères"],a:1,e:"Consanguins : même père. Utérins : même mère."},
{id:'f18',y:'IPNETP 2021',s:'f',q:"Le faon est le petit de :",o:["La hase","La biche","La cigogne","La vipère"],a:1,e:"Le faon est le petit de la biche. Le petit de la hase est le levraut."},
{id:'g1',y:'IPNETP 2022',s:'f',q:"« Je lui ai demandé s’il était prêt. » Cette phrase est :",o:["déclarative","interrogative","exclamative","impérative"],a:0,e:"C’est une interrogation indirecte : la phrase déclare un fait et finit par un point."},
{id:'g2',y:'IPNETP 2022',s:'f',q:"Phrase dont le participe passé est bien accordé :",o:["J’ai tirée une balle","Voici la balle que j’ai tiré","Voici la balle que j’ai tirer","Voici la balle que j’ai tirée"],a:3,e:"Avec avoir, le participe s’accorde avec le COD placé avant : « que » = la balle, donc tirée."},
{id:'g3',y:'IPNETP 2022',s:'f',q:"« La police recherche le voleur. » Phrase passive correspondante :",o:["La police est recherchée par le voleur","Le voleur a été recherché par la police","La police a été recherchée par le voleur","Le voleur est recherché par la police."],a:3,e:"Même temps (présent) : le COD devient sujet, le verbe passe à « est recherché », l’ancien sujet devient complément d’agent."},
{id:'g4',y:'IPNETP 2022',s:'f',q:"Phrase contenant un verbe transitif :",o:["Le bon ouvrier gagne toujours dans le travail","Le bon ouvrier gagne toujours son pain","Le bon ouvrier gagne abondamment en vivre","Le bon ouvrier gagne avec dignité."],a:1,e:"« Gagne son pain » : le verbe a un COD (son pain)."},
{id:'g5',y:'IPNETP 2022',s:'f',q:"« Les commerces sont fermés. » Subordonnée correspondante :",o:["comme les tirs d’armes se sont amplifiés","nonobstant les tirs d’armes amplifiés","si bien que les tirs d’armes se sont amplifiés","pour que les tirs d’armes s’amplifient."],a:0,e:"Les tirs d’armes expliquent la fermeture : subordonnée de cause. « Nonobstant… » est un groupe nominal, pas une subordonnée."},
{id:'g6',y:'IPNETP 2022',s:'f',q:"« Le patron est arrivé après que… » Proposition correcte :",o:["Je sois sorti du bureau.","J’étais sorti du bureau.","Je suis sorti du bureau.","Je sorte du bureau."],a:2,e:"« Après que » se construit avec l’indicatif, jamais avec le subjonctif : je suis sorti."},
{id:'g7',y:'IPNETP 2022',s:'f',q:"Une seule de ces phrases est grammaticalement incorrecte :",o:["Nous avons entendu la cantilène ce matin.","La cantilène que tu as entendue est douce.","La cantilène que tu as entendue chanter est douce.","La cantilène chantée nous a tous bercés."],a:2,e:"La cantilène est chantée par quelqu’un, elle ne chante pas : le participe reste invariable (que tu as entendu chanter)."},
{id:'g8',y:'IPNETP 2022',s:'f',q:"« Les autorités sont arrivées en retard nonobstant la persistance de la pluie. » La circonstance exprimée est une :",o:["circonstance de cause","circonstance de condition","circonstance de concession","circonstance d’opposition"],a:2,e:"« Nonobstant » signifie malgré : on exprime un obstacle qui n’a pas empêché le fait, donc la concession."},

const X=[
{id:'x1',t:"Prix des volailles (2017)",q:"Un marchand vend ensemble un poulet, un canard, une pintade et un dindon pour 46 800 F. Le poulet coûte le tiers du canard ; la pintade coûte 1 800 F de plus que le poulet ; le dindon coûte cinq fois la pintade.\nCalcule le prix de chaque volaille.",s:["x = prix du poulet. Canard : 3x. Pintade : x + 1 800. Dindon : 5(x + 1 800) = 5x + 9 000.","x + 3x + (x + 1 800) + (5x + 9 000) = 46 800","10x + 10 800 = 46 800, donc x = 3 600.","Poulet 3 600 F ; canard 10 800 F ; pintade 5 400 F ; dindon 27 000 F."]},
{id:'x2',t:"Système et problème (2020)",q:"1. Résous le système : x + y = 40 et 9x + 5y = 312.\n2. Une communauté de 40 personnes organise une sortie : un adulte paie 900 F, un adolescent 500 F, total encaissé 31 200 F. Écris le système puis trouve le nombre d’adultes et d’adolescents.",s:["y = 40 − x, puis 9x + 5(40 − x) = 312.","4x + 200 = 312, donc x = 28 et y = 12.","Système : x + y = 40 et 900x + 500y = 31 200 (divisé par 100 : 9x + 5y = 312).","28 adultes et 12 adolescents."]},
{id:'x3',t:"Expression et inéquations (2026)",q:"A = (x + 3)² − 2x(x + 3)\n1. a) Développe, réduis et ordonne A. b) Justifie que A = (x + 3)(3 − x). c) Calcule A pour x = √(3).\n2. Résous dans ℝ : 3x ≥ 2x + {2|3}.\n3. Sachant que −3x + 1 > x − 3 a pour solution ]← ; 1[, donne les solutions du système.",s:["a) A = x² + 6x + 9 − 2x² − 6x = −x² + 9.","b) Facteur commun (x + 3) : A = (x + 3)[(x + 3) − 2x] = (x + 3)(3 − x).","c) A = (3 + √(3))(3 − √(3)) = 9 − 3 = 6.","2. 3x − 2x ≥ {2|3}, donc x ≥ {2|3} : solutions [{2|3} ; →[.","3. Intersection des deux intervalles : [{2|3} ; 1[."]},
{id:'x4',t:"Statistiques (2026)",q:"Notes (effectifs) : 5 (3) ; 7 (1) ; 8 (3) ; 9 (2) ; 10 (1) ; 11 (1) ; 12 (2) ; 13 (3) ; 14 (1) ; 15 (3).\n1. Dresse le tableau des effectifs cumulés croissants.\n2. Donne le pourcentage d’élèves ayant une note dans ]11 ; 15].\n3. a) Calcule la moyenne. b) Détermine la médiane. c) Interprète-la.",s:["Effectifs cumulés : 3 ; 4 ; 7 ; 9 ; 10 ; 11 ; 13 ; 16 ; 17 ; 20.","]11 ; 15] : 2 + 3 + 1 + 3 = 9 élèves, donc {9|20} × 100 = 45 %.","Moyenne = {207|20} = 10,35.","N = 20 est pair : médiane = {10 + 11|2} = 10,5 (10ᵉ et 11ᵉ valeurs).","Interprétation : la moitié des élèves a moins de 10,5 et l’autre moitié a plus de 10,5."]},
{id:'x5',t:"Thalès (2024)",q:"ABC est rectangle en A, AB = 5 et AC = 12. M ∈ [AB] avec AM = 3. La parallèle à (BC) passant par M coupe (AC) en N.\n1. Justifie que BC = 13.\n2. a) Justifie que {AM|AB} = {MN|BC}. b) Déduis-en MN.",s:["Pythagore : BC² = AB² + AC² = 25 + 144 = 169, donc BC = 13.","Thalès, car (MN) // (BC) : {AM|AB} = {AN|AC} = {MN|BC}.","{3|5} = {MN|13}, donc MN = {3 × 13|5} = 7,8 cm."]},
{id:'x6',t:"Proportionnalité (2022)",q:"M. Koné donne 355 500 F à trois ouvriers qui ont travaillé 23, 27 et 29 jours. La rémunération est proportionnelle au nombre de jours.\n1. Calcule le salaire de chaque ouvrier.\n2. Calcule le salaire d’un ouvrier ayant travaillé 6 jours.",s:["{x|23} = {y|27} = {z|29} = k, avec x + y + z = 355 500.","k = {355 500|23 + 27 + 29} = {355 500|79} = 4 500 F par jour.","23 × 4 500 = 103 500 F ; 27 × 4 500 = 121 500 F ; 29 × 4 500 = 130 500 F.","6 × 4 500 = 27 000 F."]},
{id:'x7',t:"Fonctions affines (2025)",q:"f est affine avec f(2) = −1 et f(3) = 2. g(x) = −{1|3}x + {1|3}.\n1. Justifie que f(x) = 3x − 7.\n2. Calcule f(−{1|√(3)}).\n3. Justifie que les droites de f et g sont perpendiculaires.\n4. Résous : y = 3x − 7 et y = −{1|3}x + {1|3}.",s:["a = {2 − (−1)|3 − 2} = 3, puis −1 = 3 × 2 + b donne b = −7.","f(−{1|√(3)}) = −{3|√(3)} − 7 = −√(3) − 7. Attention au signe : le corrigé scanné l’oublie.","3 × (−{1|3}) = −1 : le produit des pentes vaut −1, donc les droites sont perpendiculaires.","3x − 7 = −{1|3}x + {1|3} donne 10x = 22, x = {11|5}, puis y = {2|5}. Point d’intersection : ({11|5} ; {2|5})."]},
{id:'x8',t:"Cube et triangle équilatéral (2021)",q:"ABCDEFGH est un cube de 6 cm d’arête.\n1. Justifie que ACH est équilatéral.\n2. Calcule AC.\n3. Calcule l’aire du triangle ACH.",s:["AC, AH et CH sont des diagonales de faces carrées de côté 6 : elles sont égales, donc ACH est équilatéral.","Pythagore dans ABC : AC² = 6² + 6² = 72, donc AC = 6√(2) cm.","Aire = {√(3)|4} × 72 = 18√(3) cm²."]},
{id:'x9',t:"Pythagore, Thalès et aire (2026)",q:"Unité : le cm (figure sur le sujet scanné). BE = 60 ; PE = 30 ; BK = 40. BEP est rectangle en E. La parallèle à (BP) passant par K coupe (EP) en O ; la parallèle à (PE) passant par K coupe (BP) en H.\n1. Calcule BP.\n2. a) Calcule tan(EBP). b) Déduis-en KH.\n3. a) Justifie que KOPH est un parallélogramme. b) Calcule son aire.",s:["Pythagore : BP² = 60² + 30² = 4 500, donc BP = 30√(5).","tan(EBP) = {PE|BE} = {30|60} = 0,5.","(KH) // (PE) : BKH est rectangle en K et a le même angle en B, donc {KH|BK} = 0,5 et KH = 40 × 0,5 = 20.","(KH) // (OP) et (KO) // (HP) : côtés opposés parallèles, donc KOPH est un parallélogramme.","Aire = KH × KE = 20 × 20 = 400 cm²."]}
];
